name: Publish calculator

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - crypto.js
      - app.js
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-calculator
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep the calculation explanation in plain English
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          replacement = "\n".join([
              '    <details>',
              '      <summary>How the calculation works</summary>',
              '      <div class="method">',
              '        <p>You enter six times: the two 6K times and the four beer times.</p>',
              '        <p>The calculator mixes those six times together and uses them to shuffle all ten names.</p>',
              '        <p>The times do not give either runner points or an advantage. Think of them as the numbers being pulled from a hat.</p>',
              '        <p>Enter the same six times again and you will get the same draft order. Change any time, even by one second, and the order will usually change.</p>',
              '      </div>',
              '    </details>',
          ])
          pattern = r'    <details>\s*<summary>How the calculation works</summary>.*?    </details>'
          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one calculation section, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Save the wording change to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Calculation explanation already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Explain the draft calculation in plain English"
            git push origin main
          fi

      - name: Publish static files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp index.html styles.css crypto.js app.js /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin gh-pages
